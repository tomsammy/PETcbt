    const mdas = ["BOS", "HMB", "KWGIS", "KWSUTH", "LGA", "MARD", "MBIT", "MENV", "MHUD", "MLGCA&CD", "MOC", "MOE", "MOEHCD", "MOF", "MOH", "MOJ", "MOL", "MOPED", "MOT", "MOTE", "MOW", "MSD", "MSMD", "MWA", "MWR", "MYD", "OHOS", "PHCDA", "State Audit"];

    // Populate MDA select
    const mdaSelect = document.getElementById('select-mda');
    mdas.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m;
      opt.textContent = m;
      mdaSelect.appendChild(opt);
    });

    function printSingleSlip(cardId) {
      const card = document.getElementById(cardId);
      if (!card) return;
      const win = window.open('', '_blank');
      win.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>Candidate Registration Slip</title>
          <style>
            body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; padding: 20px; }
            ${document.querySelector('style').innerHTML}
            .single-print-btn { display: none !important; }
            .slip-card { max-width: 580px; margin: 0 auto; box-shadow: none; }
          </style>
        </head>
        <body onload="window.print()">
          ${card.outerHTML}
        </body>
        </html>
      `);
      win.document.close();
    }

    function renderSlips(items) {
      const container = document.getElementById('slips-container');
      const countDisplay = document.getElementById('count-display');
      countDisplay.textContent = items.length.toLocaleString();

      if (items.length === 0) {
        container.innerHTML = '<div style="grid-column: span 2; text-align: center; padding: 40px; color: #64748b; font-size: 1.1rem;">No matching candidate slips found.</div>';
        return;
      }

      let html = '';
      items.forEach((c, idx) => {
        const cardId = 'slip-card-' + idx;
        html += `
        <div class="slip-card" id="${cardId}">
          <div class="slip-header">
            <h2>KWARA STATE CIVIL SERVICE COMMISSION</h2>
            <h3>2026 PROMOTION EVALUATION EXAMINATIONS</h3>
            <p>Official Candidate Onboarding & Clearance Slip</p>
          </div>

          <!-- Prominent Officer Name -->
          <div class="officer-hero-banner">
            <span class="officer-hero-label">Officer Full Name:</span>
            <div class="officer-hero-name">${c.name}</div>
          </div>

          <!-- Very Bold & Large Code 1 Box -->
          <div class="code-box-hero">
            <div class="code-box-title">🔑 REGISTRATION CLEARANCE CODE (CODE 1)</div>
            <div class="code-box-number">${c.code_1}</div>
            <div class="code-box-sub">Required with your PSN to log in to the portal & upload passport photo</div>
          </div>

          <!-- Candidate Official Details Table -->
          <table class="details-table">
            <tr>
              <td class="lbl">Public Service No (PSN):</td>
              <td class="val" style="color:#004d40; font-size:0.92rem; letter-spacing:0.04em;">${c.psn}</td>
            </tr>
            <tr>
              <td class="lbl">Ministry / MDA:</td>
              <td class="val" style="color:#0f172a; font-size:0.85rem;">${c.mda}</td>
            </tr>
            <tr>
              <td class="lbl">Cadre / Proposed GL:</td>
              <td class="val" style="color:#0f172a; font-size:0.85rem;">${c.rank} <span style="background:#e2e8f0; padding:1px 6px; border-radius:4px; font-weight:800; color:#0f172a;">GL ${c.gl}</span></td>
            </tr>
          </table>

          <!-- Step-by-Step Onboarding Guide -->
          <div class="instructions-strip">
            <strong>📋 Online Onboarding Instructions:</strong>
            <ol>
              <li>Visit official portal: <strong>kwaracsc.ng</strong> and click <strong>Verification & Photocard</strong>.</li>
              <li>Enter your <strong>PSN (${c.psn})</strong> and <strong>Code 1 (${c.code_1})</strong>.</li>
              <li>Upload your passport photograph, verify details, and generate your <strong>Official CBT Photocard</strong>.</li>
              <li>Print and bring your Photocard to the CBT Hall to receive your exam scratch token.</li>
            </ol>
          </div>

          <!-- Footer with Individual Print Button -->
          <div class="slip-footer">
            <span>Ref: KWS-CSC-REG-${c.psn}</span>
            <span>Official Portal: <strong>kwaracsc.ng</strong> &bull; Kwara State Civil Service Commission</span>
            <button type="button" class="single-print-btn" onclick="printSingleSlip('${cardId}')">🖨️ Print Slip</button>
          </div>
        </div>
        `;
      });

      container.innerHTML = html;
    }

    function applyFilters() {
      const selectedMda = document.getElementById('select-mda').value.trim();
      const selectedDay = document.getElementById('select-day').value.trim();
      const search = document.getElementById('input-search').value.trim().toLowerCase();

      const filtered = candidates.filter(c => {
        if (selectedMda && c.mda !== selectedMda) return false;
        if (selectedDay && !c.exam_date.includes(selectedDay)) return false;
        if (search) {
          const matchPsn = c.psn.toLowerCase().includes(search);
          const matchName = c.name.toLowerCase().includes(search);
          const matchCode = c.code_1.toLowerCase().includes(search);
          if (!matchPsn && !matchName && !matchCode) return false;
        }
        return true;
      });

      renderSlips(filtered);
    }

    renderSlips(candidates);
  </script>
